# Standalone Keycloak for local development.
# Usage (from this directory):
#   docker compose up -d
#
# Admin console: http://localhost:8081/admin  (admin / admin)
# OIDC issuer:   http://localhost:8081/realms/itaas-dlt

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    hostname: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/itaas-dlt-realm.json:ro
      - ./theme/nubem:/opt/keycloak/themes/nubem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
